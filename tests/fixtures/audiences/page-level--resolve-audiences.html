<html>
<head>
  <meta name="audience-foo" content="/tests/fixtures/audiences/variant-1"/>
  <meta name="audience-bar" content="/tests/fixtures/audiences/variant-2"/>
  <script>
    // The per-audience resolvers throw — proving the batched resolver replaces
    // them entirely rather than running alongside.
    window.AUDIENCES = {
      foo: () => { throw new Error('per-audience resolver should not run'); },
      bar: () => { throw new Error('per-audience resolver should not run'); },
    };
    window.resolveAudiencesCalls = [];
    window.PLUGIN_OPTIONS = {
      resolveAudiences: (names, context) => {
        window.resolveAudiencesCalls.push({ names, context });
        return { foo: true, bar: false };
      },
    };
  </script>
  <script type="module" src="/tests/fixtures/scripts.js"></script>
</head>
<body>
  <main>
    <div>Hello World!</div>
  </main>
</body>
</html>
