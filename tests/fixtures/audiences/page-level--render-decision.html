<html>
<head>
  <meta name="audience-foo" content="/tests/fixtures/audiences/variant-1"/>
  <meta name="audience-bar" content="/tests/fixtures/audiences/variant-2"/>
  <script>
    window.AUDIENCES = {
      foo: () => true,
      bar: () => false,
    }
    // A custom renderer owns applying the decision (here: a marker instead of
    // fetching the variant URL), and records the decision it was handed.
    window.renderDecisionCalls = [];
    window.PLUGIN_OPTIONS = {
      renderDecision: (el, decision) => {
        window.renderDecisionCalls.push({
          tag: el.tagName,
          type: decision.type,
          scope: decision.scope,
          url: decision.url,
          selector: decision.selector || null,
          selectedAudience: decision.config && decision.config.selectedAudience,
        });
        el.innerHTML = '<div>RENDERED ' + decision.scope + '</div>';
      },
    };
  </script>
  <script type="module" src="/tests/fixtures/scripts.js"></script>
</head>
<body>
  <main>
    <div>Hello World!</div>
  </main>
</body>
</html>
